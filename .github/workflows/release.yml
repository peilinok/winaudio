name: Release

on:
  push:
    tags: ['v*']          # e.g. v0.1.0, v1.2.3
  workflow_dispatch:
    inputs:
      package_suffix:
        description: Zip filename suffix for manual packages
        required: false
        default: manual

permissions:
  contents: write         # create the GitHub Release + upload assets

jobs:
  release:
    name: Build & publish (Release)
    runs-on: windows-2022   # pinned: windows-latest ships VS 2026; we build with the VS 2022 generator
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive   # spdlog lives in third_party/spdlog as a git submodule

      - name: Configure (CMake, VS 2022 x64)
        run: cmake --preset vs2022

      - name: Build Release (x64)
        run: cmake --build --preset release

      - name: Test Release (x64)
        run: ctest --preset release

      - name: Configure (CMake, VS 2022 x86)
        run: cmake --preset vs2022-x86

      - name: Build Release (x86)
        run: cmake --build --preset release-x86

      - name: Test Release (x86)
        run: ctest --preset release-x86

      - name: Package
        env:
          PACKAGE_SUFFIX: ${{ github.event.inputs.package_suffix || github.ref_name }}
        run: |
          $suffix = $env:PACKAGE_SUFFIX
          if ([string]::IsNullOrWhiteSpace($suffix)) {
            $suffix = "${{ github.ref_name }}"
          }
          $safeSuffix = $suffix -replace '[^A-Za-z0-9._-]', '-'
          $packages = @(
            @{ Arch = 'x64'; BuildDir = 'build' },
            @{ Arch = 'x86'; BuildDir = 'build-x86' }
          )
          foreach ($package in $packages) {
            $arch = $package.Arch
            $buildDir = $package.BuildDir
            $files = @(
              "$buildDir/bin/Release/WinAudioGui.exe",
              "$buildDir/bin/Release/WinAudioCli.exe"
            )
            Compress-Archive -Path $files -DestinationPath "WinAudio-$safeSuffix-win-$arch.zip" -Force
          }

      - name: Upload manual package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: WinAudio-manual-windows
          path: WinAudio-*-win-*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: WinAudio-*-win-*.zip
          generate_release_notes: true
