name: Release

on:
  push:
    tags: ['v*']          # e.g. v0.1.0, v1.2.3

permissions:
  contents: write         # create the GitHub Release + upload assets

jobs:
  release:
    name: Build & publish (Release)
    runs-on: windows-2022   # pinned: windows-latest ships VS 2026; we build with the VS 2022 generator
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure (CMake, VS 2022 x64)
        run: cmake --preset vs2022

      - name: Build Release
        run: cmake --build build --config Release -j

      - name: Test (ctest, Release)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: Compress-Archive -Path build/bin/Release/WinAudioGui.exe, build/bin/Release/WinAudioCli.exe -DestinationPath "WinAudio-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: WinAudio-*-win-x64.zip
          generate_release_notes: true
