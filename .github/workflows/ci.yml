name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.config }}
    runs-on: windows-2022   # pinned: windows-latest now ships VS 2026, which the "Visual Studio 17 2022" generator can't find. windows-2022 has VS 2022 (v143) + Windows SDK (DX11).
    strategy:
      fail-fast: false        # run both configs even if one fails
      matrix:
        config: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure (CMake, VS 2022 x64)
        run: cmake --preset vs2022

      - name: Build (${{ matrix.config }})
        run: cmake --build build --config ${{ matrix.config }} -j

      - name: Test (ctest, ${{ matrix.config }})
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      - name: Upload binaries (${{ matrix.config }})
        uses: actions/upload-artifact@v7
        with:
          name: WinAudio-${{ matrix.config }}
          path: |
            build/bin/${{ matrix.config }}/WinAudioGui.exe
            build/bin/${{ matrix.config }}/WinAudioCli.exe
          if-no-files-found: error
